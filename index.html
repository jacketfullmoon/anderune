<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>QuestMap LA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<!-- Top HUD -->
<header id="hud">
  <button id="hud-avatar" class="hud-avatar" aria-label="Open profile"></button>
  <div class="hud-info">
    <div id="hud-name" class="hud-name">Traveler</div>
    <div class="hud-bar"><div id="hud-hp" class="hud-hp"></div></div>
  </div>
  <div class="hud-coins"><span class="coin"></span><span id="hud-coins">0</span></div>
</header>

<button id="locate-btn" class="fab" title="Use my real location">📍</button>
<div id="loc-status" class="loc-status">Demo mode · Santa Monica</div>

<!-- Bottom nav -->
<nav id="nav">
  <button data-tab="map" class="active"><span>🗺️</span>Map</button>
  <button data-tab="bag"><span>🎒</span>Bag</button>
  <button data-tab="profile"><span>🧑‍🎤</span>Me</button>
  <button data-tab="friends"><span>🤝</span>Friends</button>
</nav>

<!-- Bottom sheet -->
<div id="sheet-backdrop" class="sheet-backdrop hidden"></div>
<section id="sheet" class="sheet hidden" aria-live="polite">
  <div class="sheet-grip"></div>
  <div id="sheet-body"></div>
</section>

<!-- Toasts -->
<div id="toasts"></div>

<!-- Battle -->
<section id="battle" class="battle hidden">
  <div class="gb">
    <div class="gb-screen">
      <div class="bt-enemy">
        <div class="bt-card">
          <div class="bt-name" id="bt-enemy-name">RIVAL</div>
          <div class="bt-lv" id="bt-enemy-lv">Lv5</div>
          <div class="bt-hpline"><b>HP</b><div class="bt-bar"><div id="bt-enemy-hp"></div></div></div>
        </div>
        <div class="bt-sprite enemy" id="bt-enemy-sprite"></div>
      </div>
      <div class="bt-me">
        <div class="bt-sprite me" id="bt-me-sprite"></div>
        <div class="bt-card">
          <div class="bt-name" id="bt-me-name">YOU</div>
          <div class="bt-lv" id="bt-me-lv">Lv5</div>
          <div class="bt-hpline"><b>HP</b><div class="bt-bar"><div id="bt-me-hp"></div></div></div>
          <div class="bt-hpnum" id="bt-me-hpnum">30/30</div>
        </div>
      </div>
      <div class="bt-box">
        <div id="bt-text" class="bt-text"></div>
        <div id="bt-menu" class="bt-menu"></div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
